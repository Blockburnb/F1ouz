<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Telemetry // Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="dashboard_new.css">
</head>
<body>

    <div class="bg-grid"></div>

    <div class="dashboard-wrapper">
        
        <header class="top-bar">
            <div class="logo-zone">
                <span class="logo-icon">🏎️</span>
                <span class="logo-text">F1 ANALYTICS <span class="highlight">PRO</span></span>
            </div>
            <div class="status-bar">
                <div class="status-item"><span class="dot active"></span> SYSTEM ONLINE</div>
                <div class="status-item" id="last-update">WAITING FOR DATA...</div>
                <a href="../index.html" class="btn-exit">EXIT</a>
            </div>
        </header>

        <main class="main-grid">
            
            <aside class="left-panel">
    
                <div class="panel-header">SÉLECTION_DONNÉES</div>
                
                <div class="selection-controls">
                    <label for="driver-search">Recherche Pilote:</label>
                    <input type="text" id="driver-search" class="form-control" placeholder="Ex: Hamilton..." autocomplete="off">

                    <label for="driver-select">Liste Pilote:</label>
                    <select id="driver-select" class="form-control"></select>
                    
                    <label for="season-select">Saison:</label>
                    <select id="season-select" class="form-control"></select>
                    
                    <button id="load-stats-btn" class="btn-action">CHARGER DONNÉES</button>
                </div>

                <div class="panel-divider"></div>
                
                <div class="panel-header">DRIVER_PROFILE</div>
                
                <div class="driver-card">
                    <div class="driver-number" id="driver-number">--</div>
                    <h1 class="driver-name" id="driver-name">--<br><span class="surname">--</span></h1>
                    <div class="driver-team" id="driver-team">--</div>
                    <div class="driver-nation" id="driver-nation">--</div>
                </div>

                <div class="panel-divider"></div>

                <div class="kpi-group">
                    <div class="kpi-box">
                        <div class="kpi-label">SAISON</div>
                        <div class="kpi-value big" id="season-year">--</div>
                    </div>
                    <div class="kpi-box">
                        <div class="kpi-label">POINTS</div>
                        <div class="kpi-value big text-blue" id="season-points-display">--</div>
                    </div>
                </div>
            </aside>

            <section class="center-panel driver-bg">
                <div class="hud-container z-1">
                     <div class="hud-circle c-1"></div>
                    <div class="hud-circle c-2"></div>
                </div>

                <div class="main-stat-box z-2">
                    <div class="stat-label">TOTAL POINTS (SAISON)</div>
                    <div class="stat-value-huge" id="total-points">0</div>
                </div>
            </section>

            <aside class="right-panel">
                <div class="panel-header">PERFORMANCE_TELEMETRY</div>

                <div class="stat-row">
                    <div class="stat-item">
                        <div class="stat-head">
                            <span>VICTOIRES</span>
                            <span class="val" id="wins-count">0</span>
                        </div>
                        <div class="progress-bar"><div class="fill" id="wins-bar" style="width: 0%"></div></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-item">
                        <div class="stat-head">
                            <span>PODIUMS</span>
                            <span class="val" id="podiums-count">0</span>
                        </div>
                        <div class="progress-bar"><div class="fill" id="podiums-bar" style="width: 0%"></div></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-item">
                        <div class="stat-head">
                            <span>COURSES TERMINÉES</span>
                            <span class="val" id="finished-count">0</span>
                        </div>
                        <div class="progress-bar"><div class="fill" id="finished-bar" style="width: 0%"></div></div>
                    </div>
                </div>

                <div class="panel-divider"></div>

                <div class="tech-data-grid">
                    <div class="tech-box">
                        <span class="icon">🏁</span>
                        <span class="label">GP DISPUTÉS</span>
                        <span class="value" id="races-count">0</span>
                    </div>
                    <div class="tech-box">
                        <span class="icon">⏱️</span>
                        <span class="label">MEILLEURE POS.</span>
                        <span class="value" id="best-pos">--</span>
                    </div>
                    <div class="tech-box">
                        <span class="icon">⚠️</span>
                        <span class="label">ABANDONS</span>
                        <span class="value" id="dnf-count">0</span>
                    </div>
                    <div class="tech-box">
                        <span class="icon">📊</span>
                        <span class="label">MOY. PTS/GP</span>
                        <span class="value" id="avg-points">0.0</span>
                    </div>
                </div>

            </aside>
        </main>
    </div>
    <script src="dashboard_new.js"></script>
</body>
</html>
